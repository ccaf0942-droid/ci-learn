name: devsecops

on:
  push:
    branches: [master]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleakc-check
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bandit:
    needs: [hello]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan in Bandit
        run: |
          pip install bandit
          bandit -r .

  image:
    needs: [bandit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Image
        run: docker build -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/secrets:v1 .

      - name: Scan Image in Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cr.yandex/${{ secrets.YC_REGISTRY_ID }}/secrets:v1'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Registry Docker For Yandex.Cloud
        run: |
          echo '${{ secrets.YC_PRIVATE_KEY }}' > key.json
          docker login --username json_key --password-stdin cr.yandex < key.json

      - name: Docker Push
        run: docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/secrets:v1
      - name: RUN
        run: docker run --rm cr.yandex/${{ secrets.YC_REGISTRY_ID }}/secrets:v1

        



