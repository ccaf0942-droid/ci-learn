name: devsecops

on:
  push:
    branches: [master]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install bandit 
          bandit -r .

  images:
    needs: [hello]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/tuta:v1 .

      - name: Checks ON Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cr.yandex/${{ secrets.YC_REGISTRY_ID }}/tuta:v1'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
      
      - name: Loging
        run: |
          echo '${{ secrets.YC_PRIVATE_KEY }}' > key.json
          docker login --username json_key --password-stdin cr.yandex < key.json

      - name: Push to reestr yandex.cloud
        run: docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/tuta:v1
      



      
