name: devsecops

on:
  push:
    branches: [master]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install bandit
          bandit -r .
          
  image:
    needs: [hello]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/webs:01 .

      - name: Checks To Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cr.yandex/${{ secrets.YC_REGISTRY_ID }}/webs:01'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Loging Docker from Yandex.Cloud
        run: |
          echo '${{ secrets.YC_PRIVATE_KEY }}' > key.json
          docker login --username json_key --password-stdin cr.yandex < key.json

      - name: Push
        run: docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/webs:01
        run: python chels.py




      
