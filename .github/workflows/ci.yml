name: popit

on:
    push:
        branches: [master]

jobs:
    hello:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: docker build -t apps .
            # От себя добавил проверку на то что собрался ли образ или нет чтобы потом при ошибки можно было легче ее отладить
            - run: docker image list
            - run: docker run --rm apps