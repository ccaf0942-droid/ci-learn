name: last

on:
    push:
        branches: [master]

jobs:
    hello:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: docker build -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/myapp:v8 .
            - run: echo '${{ secrets.YC_PRIVATE_KEY }}' > key.json
            - run: docker registry --username json_key --password-stdin cr.yandex < key.json
            - run: docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/myapp:v8