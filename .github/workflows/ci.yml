name: devsecops

on:
  push:
    branches: [master]

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bandit-scan:
    needs: [scan-secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install bandit
          bandit -r .

  image:
    needs: [bandit-scan]
    runs-on: ubuntu-latest

    steps:
      - name: Build image
        run: docker build -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/ror:v1 .

      - name: Scan To Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cr.yandex/${{ secrets.YC_REGISTRY_ID }}/ror:v1'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
      
      - name: Registry Docker 
        run: |
          echo '${{ secrets.YC_PRIVATE_KEY }}' > key.json
          docker login --username json_key --password-stdin cr.yandex < key.json

      - name: Docker Push
        run: docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/ror:v1

          


