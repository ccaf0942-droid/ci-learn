name: devsecops

on:
  push:
    branches: [master]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Checks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bandit:
    needs: [secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bandit Run
        run: |
          pip install bandit
          bandit -r .

  pip:
    needs: [secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pip-auidt Run
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt

  falke:
    needs: [secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flake8 Run
        run: |
          pip install flake8
          flake8 . --max-line-lenght=120

  image:
    needs: [falke, bandit, pip]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Image Build
        run: docker build -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/v:1 .

      - name: Trivy Scan Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cr.yandex/${{ secrets.YC_REGISTRY_ID }}/v:1'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Docker Login
        run: echo '${{ secrets.YC_PRIVATE_KEY }}' | docker login --username json_key --password-stdin cr.yandex

      - name: Docker Push
        run: docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/v:1
  
      
