name: devseco

on:
  push:
    branches: [master]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks-scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    

  bandit:
    needs: [hello]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: scan On bandit
        run: |
          pip install bandit
          bandit -r .

  image:
    needs: [bandit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build image 
        run: docker build -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/pop:v2 .
      
      - name: scan To Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cr.yandex/${{ secrets.YC_REGISTRY_ID }}/pop:v2'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Login Docker in Yandex.Cloud
        run: |
          echo '${{ secrets.YC_PRIVATE_KEY }}' > key.json
          docker login --username json_key --password-stdin cr.yandex < key.json

      - name: docker push 
        run: docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/pop:v2
      - name: image RUN
        run: docker run --rm cr.yandex/${{ secrets.YC_REGISTRY_ID }}/pop:v2

      
