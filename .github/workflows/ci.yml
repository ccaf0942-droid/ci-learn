name: devsecops

on:
  push:
    branches: [master]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Run
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bandit:
    needs: [secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bandit Run
        run: |
          pip install bandit
          bandit -r .
  
  safety:
    needs: [secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Safety Run
        env:
          SAFETY_ANONYMOUS_TELEMETRY: "1"
        run: |
          pip install safety
          safety scan --file requirements.txt

  flake:
    needs: [secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flake8 Run
        run: |
          pip install flake8
          flake8 . --max-line-length=120

  image:
    needs: [flake, safety, bandit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Image Build
        run: docker build -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/ff:v1 .

      - name: Trivy Checks Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cr.yandex/${{ secrets.YC_REGISTRY_ID }}/ff:v1'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Docker Login
        run: echo '${{ secrets.YC_PRIVATE_KEY }}' | docker login --username json_key --password-stdin cr.yandex

      - name: Docker Push
        run: docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/ff:v1

      

  
      
