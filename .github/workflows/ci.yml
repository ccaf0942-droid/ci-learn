name: BASA

on:
    push:
        branches: [master]

jobs:
    hello:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: docker build -t check .
            - run: docker image list

            # Делаем вторую джобу по заданию ты сам просил это сделать для запуска контейнера

    play:
        runs-on: ubuntu-latest 
        steps:
            - uses: actions/checkout@v4
            - run: docker build -t runs .
            - run: docker run --rm runs