name: devsec

on:
  push:
    branches: [master]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checks secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bandit:
    needs: [hello]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r .

  image:
    needs: [bandit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Image
        run: docker build -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/you:1 .

      - name: Scan Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cr.yandex/${{ secrets.YC_REGISTRY_ID }}/you:1'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Docker Login
        run: |
          echo '${{ secrets.YC_PRIVATE_KEY }}' | docker login --username json_key --password-stdin cr.yandex

      - name: Docker Push
        run: docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/you:1
        



