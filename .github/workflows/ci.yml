name: devsecops

on:
    push:
        branches: [master]

jobs:
    hello:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: pip install bandit
            - run: bandit -r .
            
    images:
        needs: [hello]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: docker build -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/ws:12 .
            - run: |
                docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
                    aquasec/trivy:latest image myapp --severity HIGH, CRITICAL --exit-code 1 \
                    --no-progress

            - run: echo '${{ secrets.YC_PRIVATE_KEY }}' > key.json
            - run: docker login --username json_key --password-stdin cr.yandex < key.json
            - run: docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/ws:12
            